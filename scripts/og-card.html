<!doctype html>
<!--
  Social preview card (1200x630) for LinkedIn / Slack / X link unfurls.
  Regenerate after editing (run from the repo root):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=5000 --screenshot=og-card.png "file://$PWD/scripts/og-card.html" \
      && sips -s format jpeg -s formatOptions 88 og-card.png --out public/og-card.jpg && rm og-card.png
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #07090e;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      }
      .glow { position: absolute; border-radius: 50%; pointer-events: none; }
      .glow.cyan { top: -240px; left: -180px; width: 680px; height: 680px; background: radial-gradient(circle, rgba(56, 189, 248, 0.26), transparent 65%); }
      .glow.indigo { bottom: -280px; right: -140px; width: 660px; height: 660px; background: radial-gradient(circle, rgba(129, 140, 248, 0.24), transparent 65%); }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #0284c7 0%, #6366f1 50%, #e11d48 100%); }
      .wrap { position: relative; display: flex; align-items: center; gap: 56px; height: 100%; padding: 0 72px; box-sizing: border-box; }
      .photo { flex-shrink: 0; width: 300px; height: 300px; border-radius: 50%; overflow: hidden; border: 4px solid rgba(56, 189, 248, 0.55); box-shadow: 0 0 70px rgba(56, 189, 248, 0.35); }
      .photo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.05); }
      .tag { font-size: 17px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #38bdf8; margin-bottom: 14px; }
      h1 { font-family: 'Outfit', sans-serif; font-size: 72px; line-height: 1; font-weight: 800; letter-spacing: -1.5px; margin: 0 0 16px; }
      .title { font-size: 26px; line-height: 1.35; font-weight: 600; color: #cbd5e1; margin: 0 0 28px; max-width: 700px; }
      .chips { display: flex; flex-wrap: wrap; gap: 12px; max-width: 720px; margin-bottom: 28px; }
      .chip { font-size: 19px; font-weight: 700; padding: 9px 18px; border-radius: 999px; color: #e0f2fe; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.42); }
      .url { font-size: 21px; font-weight: 600; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="glow cyan"></div>
    <div class="glow indigo"></div>
    <div class="wrap">
      <div class="photo"><img src="../public/hero_profile.jpg" alt="" /></div>
      <div>
        <div class="tag">Enterprise Agentic AI · Google Cloud</div>
        <h1>Enrique Chan</h1>
        <p class="title">Staff AI Technical Deployment Lead (Delta) &amp; Outbound Product Manager</p>
        <div class="chips">
          <span class="chip">$2B+ Multi-Year Deal Scope</span>
          <span class="chip">4x Gartner &amp; Forrester Leader</span>
          <span class="chip">40M+ Olympic Viewers</span>
          <span class="chip">32K+ Developers</span>
        </div>
        <div class="url">enriquekchan.web.app</div>
      </div>
    </div>
    <div class="bar"></div>
  </body>
</html>
